project:
  type: website
  render:
  - '*.qmd'
  output-dir: docs
  resources:
  - assets/files/**
  - '!assets/files/datasets/commercial-banking/index.html'
  - '!assets/files/datasets/commercial-banking/code/preview_template.html'
  - assets/js/site.js
  - assets/js/commercial-banking.js
  - assets/css/commercial-banking.css
  - assets/img/favicon.svg
  - assets/img/healthcare/**
  post-render:
  - python3 scripts/after_render.py
website:
  title: Adam Dittrich
  site-url: https://adamdittrich.github.io
  description: Adam Dittrich, economic historian at Prague University of Economics
    and Business. Research, publications, historical datasets, teaching and CV.
  favicon: assets/img/favicon.svg
  open-graph:
    locale: en_GB
    site-name: Adam Dittrich — Economic Historian
  twitter-card:
    card-style: summary
  search:
    location: navbar
    type: overlay
  navbar:
    pinned: true
    title: Adam Dittrich
    left:
    - href: index.qmd
      text: Home
    - href: research.qmd
      text: Research
    - href: publications.qmd
      text: Publications
    - href: data.qmd
      text: Data
    - href: teaching.qmd
      text: Teaching
    - href: cv.qmd
      text: CV
    right:
    - href: contact.qmd
      text: Contact
  page-footer:
    left: © 2026 Adam Dittrich
    right:
    - text: Email
      href: mailto:adam.dittrich@vse.cz
    - text: ORCID
      href: https://orcid.org/0000-0002-7803-1339
    - text: GitHub
      href: https://github.com/adamdittrich
format:
  html:
    lang: en
    theme:
    - cosmo
    - assets/css/theme.scss
    css:
    - assets/css/site-v4.css
    - assets/css/healthcare-project.css
    toc: false
    smooth-scroll: false
    link-external-newwindow: true
    include-after-body: assets/includes/site-script.html
    page-layout: custom
    anchor-sections: false
bibliography: assets/files/publications.bib
csl: assets/files/chicago-author-date.csl
execute:
  freeze: auto
