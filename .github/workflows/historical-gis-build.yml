name: Historical GIS polygons and Copernicus terrain
on:
  push:
    branches:
      - research/historical-gis-build-2026-11-03
    paths:
      - '.github/workflows/historical-gis-build.yml'
      - 'research/historical_gis/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-gis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.2" "pandas>=2.1,<3" "geopandas>=1.0" "rasterio>=1.4" "pyogrio>=0.9" "scipy>=1.12" requests
      - name: Fetch historic ArcGIS district polygons and derive Copernicus terrain
        run: python research/historical_gis/remote_build.py
      - name: Upload produced research files, even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-gis-czech-districts-terrain
          path: results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
