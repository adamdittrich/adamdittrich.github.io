<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="650" viewBox="70 430 450 287" role="img" aria-labelledby="title desc">
<title id="title">The changing composition of the Slovak–Czech infant mortality gap</title>
<desc id="desc">Original bar and marker geometry from Figure 6, page 11 of More Doctors, Unequal Survival. In 1965 the neonatal gap was −0.25 and the postneonatal gap +5.06 deaths per 1,000 live births; in 1983 they were +1.80 and +1.20. Diamonds mark the total gap, 4.81 and 3.00. Positive values indicate higher Slovak mortality.</desc>
