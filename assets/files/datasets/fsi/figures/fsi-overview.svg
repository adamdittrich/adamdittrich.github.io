 <title id="figure-title">Financial stress peaks in March 1932</title>
 <desc id="figure-description">Monthly narrow FSI and broad MFSI, November 1929 to August 1938. Both peak in March 1932. Pale bands identify narrow-FSI high-stress episodes. A vertical marker identifies the February 1934 reserve reform. The indices average standardized components, so their index-point scales are not unit-standard-deviation scales.</desc>

