 <title id="figure-title">Alternative aggregation preserves the broad chronology</title>
 <desc id="figure-description">The baseline, principal-component, and dispersion-weighted FSI measures all peak in March 1932. Each plotted series is standardized to zero mean and unit sample standard deviation for comparison. Correlations with baseline FSI are 0.973 for the principal component and 0.990 for the dispersion-weighted index.</desc>

