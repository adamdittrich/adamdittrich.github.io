<svg role="img" aria-labelledby="figure-title figure-description" xmlns:xlink="http://www.w3.org/1999/xlink" width="748.8pt" height="388.8pt" viewBox="0 0 748.8 388.8" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id="figure-title">Current financial stress and later real-economy distress</title>
 <desc id="figure-description">Coefficients for a one-sample-standard-deviation increase in current narrow FSI in regressions for the future real-distress block, controlling for current real distress, a linear trend, and calendar-month effects. Points are estimates at one, three, six, nine, twelve, eighteen and twenty-four months; bars use beta plus or minus 1.96 Newey-West standard errors. The associations are positive through twelve months; the longer-horizon intervals cross zero.</desc>

