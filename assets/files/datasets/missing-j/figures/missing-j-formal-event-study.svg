 <title id="figure-title">Event timing carries pre-existing dynamics</title>
 <desc id="figure-description">Formal event-study coefficients for eight European devaluation episodes, with country and calendar-month fixed effects and country-clustered 95 percent confidence intervals. Estonia is excluded from this event-study definition. The omitted reference month is minus one and is shown as an unfilled zero marker, not an estimate. Pre-event coefficients are negative and jointly significant, p equals 0.011. The month-twelve coefficient is 1.28 log points with an interval from minus 8.83 to 11.38. This evidence limits a causal interpretation of the descriptive devaluation-event paths.</desc>

