 <title id="figure-title">A stronger trade ratio across nine devaluation episodes</title>
 <desc id="figure-description">Arithmetic mean of nine complete country-specific event paths, each indexed to 100 in the month before devaluation. At month twelve the mean export-value index is 111.29, the import-value index 100.63 and the export/import-ratio index 112.57. An average of separately exponentiated indices is not the exponent of the average log change. The separately reported twelve-month mean log-ratio change is 10.58 log points. These descriptive event paths do not isolate a causal effect of devaluation.</desc>

