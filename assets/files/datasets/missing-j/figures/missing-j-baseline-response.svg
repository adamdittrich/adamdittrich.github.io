<svg role="img" aria-labelledby="figure-title figure-description" xmlns:xlink="http://www.w3.org/1999/xlink" width="748.8pt" height="424.8pt" viewBox="0 0 748.8 424.8" xmlns="http://www.w3.org/2000/svg" version="1.1">
 <title id="figure-title">The early deterioration is missing</title>
 <desc id="figure-description">Baseline local projections of the cumulative change in log exports divided by imports from month t minus one to t plus h. The response to a 0.10-log-unit real effective depreciation is 2.15 log points after one month, 5.77 after three months and 4.93 after twelve months. Estimates are positive through month fifteen; later confidence intervals include zero. Shading shows 95 percent intervals based on country-clustered standard errors. This is a conditional panel association, not an externally identified causal shock.</desc>

